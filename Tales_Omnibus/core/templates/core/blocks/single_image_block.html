{% load wagtailimages_tags %}
{# position : centre, gauche, droite ou large (classe block-image--…, voir structure.css) #}
<figure class="block-single-image block-image--{{ value.position|default:'centre' }}">
    {% image value.image width-1000 alt=value.alt_text|default:value.image.title %}
    {% if value.caption %}
        <figcaption>{{ value.caption }}</figcaption>
    {% endif %}
</figure>
