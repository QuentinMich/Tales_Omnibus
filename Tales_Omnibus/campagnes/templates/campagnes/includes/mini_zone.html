{# Une zone surlignée sur une mini-carte (même dessin que la page Carte). #}
{# Attend « apparition » dans le contexte.                                #}
{% with couleur=apparition.categorie_affichee.couleur_effective %}
    {% if apparition.est_hachuree %}
        <span class="carte-hachures" aria-hidden="true"
              style="clip-path: {{ apparition.clip_path }};{% if couleur %} --marker-color: {{ couleur }};{% endif %}"></span>
    {% endif %}
    <svg class="carte-zones" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
        <polygon class="{{ apparition.classes_zone }} carte-zone--seule" points="{{ apparition.points_svg }}"{% if couleur %} style="--marker-color: {{ couleur }};"{% endif %}></polygon>
    </svg>
{% endwith %}
