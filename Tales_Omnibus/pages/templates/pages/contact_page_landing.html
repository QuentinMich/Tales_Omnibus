{% extends "base.html" %}
{% load wagtailcore_tags %}

{% block content %}
<main class="contact-container contact-landing">
    <h1>Message envoyé !</h1>

    {% if page.thank_you_text %}
        <div class="contact-thanks">{{ page.thank_you_text|richtext }}</div>
    {% else %}
        <p>Merci pour votre message, nous vous répondrons dès que possible.</p>
    {% endif %}

    <a href="{% pageurl page %}" class="btn">&larr; Envoyer un autre message</a>
</main>
{% endblock %}
